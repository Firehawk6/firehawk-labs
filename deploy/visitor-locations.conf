location = /api/visitors/visit {
    limit_req zone=firehawk_visits burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 256;
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}
location = /api/visitors {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location = /api/sorts {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}
location = /api/sorts/complete {
    limit_req zone=firehawk_sorts burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 256;
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location = /api/twitch {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}
